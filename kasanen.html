<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>3D AR合成ビューア「かさねん」</title>
  <link rel="stylesheet" href="style.css?v=9.8" />
  <script src="shared-stl.js?v=1.4"></script>
</head>
<body class="kasanen-page" data-default-model="">
  <div id="appNavControls" class="app-nav-controls">
    <button id="btnMenu" class="btn-default" type="button">初期メニュー</button>
    <button id="btnTsuyoin" class="btn-orange" type="button">「つよいん」</button>
    <button id="btnKidorin" class="btn-green" type="button">「きどりん」</button>
    <span class="app-name-badge">「かさねん」</span>
  </div>

  <div id="modelControls" class="kasanen-model-controls">
    <button id="btnLoadModel">モデル読み込み</button>
    <input type="file" id="modelInput" accept=".stl,.glb,.gltf" style="display:none" />
  </div>

  <div id="dropZone">ここにモデルファイルをドロップ</div>

  <div id="bgControls" style="display:none;">
    <button id="btnCapture"      class="btn-accent"  style="display:none;">📷 キャプチャ</button>
    <button id="btnImage"        class="btn-default">🖼 静止画背景</button>
    <button id="btnCamera"       class="btn-default">📹 カメラ背景</button>
    <button id="btnSwitchCamera" class="btn-orange"  style="display:none;">🔄 カメラ切替</button>
    <button id="btnReloadModel"  class="btn-default">↩ 再読み込み</button>
    <button id="btnBackAR"       class="btn-default" style="display:none;">✕ 背景リセット</button>
    <input type="file" id="fileInput" accept="image/*" style="display:none" />
    <button id="btnToggleWire"   class="btn-default">⬡ ポリゴン表示</button>
    <button id="btnShowStats"    class="btn-default">📊 統計情報</button>
    <button id="btnToggleDimensions" class="btn-default">📏 寸法表示</button>
    <button id="btnUnitToggle" class="btn-default" title="mm / cm 単位切替">mm</button>
    <button id="btnColorParts"   class="btn-color"   style="display:none;">🎨 STL部品区別</button>
  </div>

  <div id="statsPanel"></div>
  <video id="video" autoplay muted playsinline style="display:none;"></video>
  <canvas id="arCanvas"></canvas>

  <script>
    // Three.js の読み込みに失敗しても，移動ボタンだけは必ず動くようにする。
    window.addEventListener('DOMContentLoaded', function(){
      var navMenu = document.getElementById('btnMenu');
      var navTsuyoin = document.getElementById('btnTsuyoin');
      var navKidorin = document.getElementById('btnKidorin');
      if (navMenu) navMenu.onclick = function(){ window.location.href = 'index.html'; };
      if (navTsuyoin) navTsuyoin.onclick = function(){ window.location.href = 'kidori.html?openStrength=1&headless=1'; };
      if (navKidorin) navKidorin.onclick = function(){ window.location.href = 'kidori.html'; };
    });
  </script>

  <!-- file:// でも動きやすいよう，ES Module ではなく通常版 Three.js を使用 -->
  <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="kasanen.js?v=9.9"></script>
  <script src="app-info.js?v=1.1"></script>
</body>
</html>
